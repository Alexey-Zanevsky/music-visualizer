<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="visualizer" id="visualizer">

        <div class="background" id="background"></div>
        <div class="background-overlay"></div>

        <!-- Video backgrounds -->
        <div class="video-backgrounds" id="video-backgrounds">
            <video class="video-background" data-video="1" src="mp4/vid_1.mp4" muted loop playsinline></video>

            <video class="video-background" data-video="2" src="mp4/vid_2.mp4" muted loop playsinline></video>

            <video class="video-background" data-video="3" src="mp4/vid_3.mp4" muted loop playsinline></video>

            <video class="video-background" data-video="4" src="mp4/vid_4.mp4" muted loop playsinline></video>

            <video class="video-background" data-video="5" src="mp4/vid_5.mp4" muted loop playsinline></video>

            <video class="video-background" data-video="6" src="mp4/vid_6.mp4" muted loop playsinline></video>

            <video class="video-background" data-video="7" src="mp4/vid_7.mp4" muted loop playsinline></video>

            <video class="video-background" data-video="8" src="mp4/vid_8.mp4" muted loop playsinline></video>

            <video class="video-background" data-video="9" src="mp4/vid_9.mp4" muted loop playsinline></video>

            <video class="video-background" data-video="10" src="mp4/vid_10.mp4" muted loop playsinline></video>

            <video class="video-background" data-video="11" src="mp4/vid_11.mp4" muted loop playsinline></video>

            <video class="video-background" data-video="12" src="mp4/vid_12.mp4" muted loop playsinline></video>
        </div>

        <section class="content">

            <div class="track-side">

                <div class="cover-wrap">
                    <img class="cover" id="cover" src="" alt="Album cover">
                </div>

                <div class="track-info">
                    <div class="track-title" id="track-title"></div>
                    <div class="track-artist" id="track-artist"></div>
                    <div class="track-album" id="track-album"></div>
                </div>

            </div>

            <div class="lyrics-side">
                <div class="lyrics" id="lyrics"></div>
            </div>

        </section>

        <div class="bars" id="bars" aria-hidden="true"></div>
        <div class="transition" id="transition"></div>

        <div class="sidebar-trigger"></div>

        <aside class="sidebar" aria-label="Visualizer controls">
            <div class="sidebar-content">

                <button class="fullscreen-button icon-button" id="fullscreen-button" type="button"
                    aria-label="Enter fullscreen">
                    <i data-lucide="maximize"></i>
                    <span>Fullscreen mode</span>
                </button>

                <button class="display-mode-button icon-button" id="display-mode-button" type="button"
                    aria-label="Switch display mode">
                    <i data-lucide="panel-right-close"></i>
                    <span>Lyrics mode</span>
                </button>

                <button class="spotify-login icon-button" id="spotify-login" type="button">
                    <i data-lucide="music"></i>
                    <span>Connect Spotify</span>
                </button>

                <button class="spotify-logout icon-button" id="spotify-logout" type="button">
                    <i data-lucide="log-out"></i>
                    <span>Disconnect Spotify</span>
                </button>

                <div class="background-section">
                    <div class="background-section-title">Background styles</div>

                    <div class="background-grid">

                        <button class="background-card background-card-standard" type="button"
                            data-background="standard">
                            <div class="standard-preview"></div>
                            <span>Standard</span>
                        </button>

                        <button class="background-card" type="button" data-background="video-1">
                            <video src="mp4/vid_1.mp4" muted loop playsinline></video>
                            <span>Style 1</span>
                        </button>

                        <button class="background-card" type="button" data-background="video-2">
                            <video src="mp4/vid_2.mp4" muted loop playsinline></video>
                            <span>Style 2</span>
                        </button>

                        <button class="background-card" type="button" data-background="video-3">
                            <video src="mp4/vid_3.mp4" muted loop playsinline></video>
                            <span>Style 3</span>
                        </button>

                        <button class="background-card" type="button" data-background="video-4">
                            <video src="mp4/vid_4.mp4" muted loop playsinline></video>
                            <span>Style 4</span>
                        </button>

                        <button class="background-card" type="button" data-background="video-5">
                            <video src="mp4/vid_5.mp4" muted loop playsinline></video>
                            <span>Style 5</span>
                        </button>

                        <button class="background-card" type="button" data-background="video-6">
                            <video src="mp4/vid_6.mp4" muted loop playsinline></video>
                            <span>Style 6</span>
                        </button>

                        <button class="background-card" type="button" data-background="video-7">
                            <video src="mp4/vid_7.mp4" muted loop playsinline></video>
                            <span>Style 7</span>
                        </button>

                        <button class="background-card" type="button" data-background="video-8">
                            <video src="mp4/vid_8.mp4" muted loop playsinline></video>
                            <span>Style 8</span>
                        </button>

                        <button class="background-card" type="button" data-background="video-9">
                            <video src="mp4/vid_9.mp4" muted loop playsinline></video>
                            <span>Style 9</span>
                        </button>

                        <button class="background-card" type="button" data-background="video-10">
                            <video src="mp4/vid_10.mp4" muted loop playsinline></video>
                            <span>Style 10</span>
                        </button>

                        <button class="background-card" type="button" data-background="video-11">
                            <video src="mp4/vid_11.mp4" muted loop playsinline></video>
                            <span>Style 11</span>
                        </button>

                        <button class="background-card" type="button" data-background="video-12">
                            <video src="mp4/vid_12.mp4" muted loop playsinline></video>
                            <span>Style 12</span>
                        </button>

                    </div>
                </div>

            </div>
        </aside>

    </main>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="spotify.js"></script>
    <script src="lyrics.js"></script>
    <script src="app.js"></script>

</body>

</html>
